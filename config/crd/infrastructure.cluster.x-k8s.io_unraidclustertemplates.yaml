  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: unraidclustertemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: UnraidClusterTemplate
    listKind: UnraidClusterTemplateList
    plural: unraidclustertemplates
    singular: unraidclustertemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: UnraidClusterTemplate is the ClusterClass template for UnraidClusters.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: UnraidClusterTemplateSpec is an UnraidClusterTemplate's spec.
            properties:
              template:
                description: UnraidClusterTemplateResource is a template's UnraidCluster.
                properties:
                  metadata:
                    description: ObjectMeta is the metadata a template may carry.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  spec:
                    description: |-
                      UnraidClusterSpec says which Unraid server a cluster runs on and how to
                      reach it.
                    properties:
                      controlPlaneEndpoint:
                        description: controlPlaneEndpoint is set by the UnraidControlPlane
                          (host:6443).
                        minProperties: 1
                        properties:
                          host:
                            description: host is the hostname or IP the API server
                              is served on.
                            type: string
                          port:
                            description: port is the port the API server is served
                              on.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        type: object
                      credentialsRef:
                        description: |-
                          credentialsRef names a Secret in this namespace holding `username` and
                          either `password` or `privateKey` (PEM) for SSH. Unraid has no
                          key-only mode by default, so password auth is the usual choice.
                        properties:
