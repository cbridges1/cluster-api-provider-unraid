    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UnraidControlPlane is a k3s server running as a container on an Unraid
          server.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
